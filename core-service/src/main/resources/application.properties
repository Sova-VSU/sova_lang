spring.application.name=core-service
server.port=${PORT:8081}

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/core_service}

subscription.service.url=${SUBSCRIPTION_SERVICE_URL:http://localhost:8082}

jwt.secret=${JWT_SECRET:sova-dev-jwt-secret-key-min-32-chars}
jwt.access-token-expiry-seconds=900
jwt.refresh-token-expiry-seconds=2592000
